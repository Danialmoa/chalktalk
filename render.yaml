services:
  - type: web
    name: chalktalk
    runtime: python
    # Free sleeps after 15 idle minutes and takes ~1 min to wake; `starter` stays on.
    plan: free
    # Native runtimes include Node, so one service builds the page and runs the API.
    buildCommand: npm ci && npm run build && pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Vite 8 needs Node 20.19+.
      - key: NODE_VERSION
        value: 22.12.0
      - key: BACKBOARD_API_KEY
        sync: false
      - key: BACKBOARD_MODEL
        value: google/gemma-4-26b-a4b-it
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chalktalk-db
          property: connectionString

databases:
  - name: chalktalk-db
    plan: free
